version: '3.8'

services:
  ddos-guard-gateway:
    build: .
    container_name: ddos_guard_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=capstone_prod_secret_ddos_defense_2024
      - RATE_LIMIT_WINDOW_MS=60000
      - MAX_REQUESTS_PER_WINDOW=60
      - ENDPOINT_SURGE_THRESHOLD=30
      - QUARANTINE_DURATION_MS=30000
    volumes:
      - ddos_data:/usr/src/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  ddos_data:
